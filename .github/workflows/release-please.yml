name: release-please

# GITHUB_TOKEN-created release PRs require a maintainer to approve CI runs.
# Invoke binary publishing directly: bot-created tag/release events do not
# trigger other workflows. See docs/releasing.md.
on:
  push:
    branches: [main]

permissions:
  contents: write # release-please creates tags/releases and the release PR
  pull-requests: write # release-please opens/updates the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ github.token }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      SOCKET_FIREWALL_TOKEN: ${{ secrets.SOCKET_FIREWALL_TOKEN }}
