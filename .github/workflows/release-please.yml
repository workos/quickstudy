name: release-please

# GITHUB_TOKEN-created release PRs require a maintainer to approve CI runs.
# Invoke binary + npm publishing directly: bot-created tag/release events do
# not trigger other workflows.
on:
  push:
    branches: [main]

permissions:
  contents: write # release-please creates tags/releases and the release PR
  pull-requests: write # release-please opens/updates the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ github.token }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # A called workflow can only request permissions its caller holds, so the
    # publish-npm job's id-token: write (npm trusted publishing, OIDC) must be
    # granted here. Scoped to this job: release-please itself never needs it.
    # npm validates the CALLING workflow's filename, so this file — not
    # release.yml — is the package's only trusted publisher on npmjs.com.
    permissions:
      contents: write # release.yml uploads assets and undrafts the release
      id-token: write # release.yml exchanges an OIDC token with npm
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      SOCKET_FIREWALL_TOKEN: ${{ secrets.SOCKET_FIREWALL_TOKEN }}
