name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: test / typecheck / lint / pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # Docker-gated suites auto-skip on hosted runners (the quickstudy test
      # images aren't present); live-API suites are env-gated off.
      - run: bun test
      - run: bun run typecheck
      - run: bun run lint
      # The tarball self-check runs BEFORE the dry-run assertions: it builds
      # ui/dist, so the loop below never depends on npm running prepack
      # during --dry-run (lifecycle behavior that has varied across npm
      # versions — on a clean checkout ui/dist doesn't exist yet).
      - name: Tarball installs and runs in a clean directory
        run: bash scripts/pack-check.sh
      # --ignore-scripts keeps prepack's own output (which mentions ui/dist)
      # out of the captured text, so each grep can only match the packed
      # file list — the assertion cannot be satisfied vacuously.
      - name: Packed file list carries each required entry
        run: |
          set -euo pipefail
          out=$(npm pack --dry-run --ignore-scripts 2>&1) || { printf '%s\n' "$out"; exit 1; }
          for p in 'src/cli.ts' 'src/index.ts' 'ui/dist' 'LICENSE'; do
            printf '%s\n' "$out" | grep -q "$p" || { echo "missing: $p"; exit 1; }
          done
