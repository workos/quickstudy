name: release binaries

# Two entry points, both synchronous (no reliance on GITHUB_TOKEN tag/release
# events, which GitHub suppresses for runs triggered by the GITHUB_TOKEN):
#   1. workflow_call from .github/workflows/release-please.yml — release-please
#      has already created the vX.Y.Z tag and a DRAFT release; this workflow
#      checks out the exact tag, builds + smoke-tests the four native
#      binaries, runs the tarball self-check, then attaches the archives to
#      that draft release, undrafts it, and publishes the tarball to npm
#      (publish-npm). tag_name is required here.
#   2. pull_request — validate the native build and packaging path against the
#      current PR source, while the publish jobs remain skipped.
# There is deliberately no workflow_dispatch. A failed release is retried with
# "Re-run failed jobs" on the release-please run — same run, same calling
# workflow, so npm trusted publishing sees the same identity. Anything else
# is a new release.
on:
  workflow_call:
    inputs:
      tag_name:
        description: Existing v* tag whose release-please draft release to attach binaries to
        required: true
        type: string
  pull_request:

permissions:
  contents: read

# One release per tag at a time; cancel-in-progress: false so a running
# release is never aborted mid-build.
concurrency:
  group: release-${{ inputs.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64-baseline
            bun_compile_package: '@oven/bun-linux-x64-baseline'
            asset: quickstudy-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            bun_compile_package: '@oven/bun-linux-aarch64'
            asset: quickstudy-linux-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            bun_compile_package: '@oven/bun-darwin-x64'
            asset: quickstudy-darwin-x64
          - runner: macos-15
            target: bun-darwin-arm64
            bun_compile_package: '@oven/bun-darwin-aarch64'
            asset: quickstudy-darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the requested tag when publishing; otherwise build the
          # immutable event SHA (PR validation).
          ref: ${{ inputs.tag_name || github.sha }}
          fetch-depth: 0
      - name: Verify checked-out source
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ -n "$REQUESTED_TAG" ]; then
            case "$REQUESTED_TAG" in
              v*) ;;
              *) echo "::error::tag must begin with v"; exit 1 ;;
            esac
            expected="$(git rev-list -n 1 "refs/tags/$REQUESTED_TAG")"
            source_ref="$REQUESTED_TAG"
          else
            source_ref="$EVENT_SHA"
            expected="$EVENT_SHA"
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked out $actual, expected $expected from $source_ref"
            exit 1
          fi
          echo "SOURCE_REF=$source_ref" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$actual" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Download Bun compile runtime
        id: compile-runtime
        shell: bash
        env:
          BUN_VERSION: '1.4.3'
          COMPILE_PACKAGE: ${{ matrix.bun_compile_package }}
        run: |
          set -euo pipefail
          actual_bun_version="$(bun --version)"
          if [ "$actual_bun_version" != "$BUN_VERSION" ]; then
            echo "::error::expected Bun $BUN_VERSION, got $actual_bun_version"
            exit 1
          fi
          bun build --help | grep -F -- '--compile-executable-path' >/dev/null || {
            echo '::error::Bun does not support --compile-executable-path'
            exit 1
          }
          runtime_dir="$RUNNER_TEMP/bun-compile-runtime-${{ matrix.asset }}"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          npm pack --pack-destination "$runtime_dir" "$COMPILE_PACKAGE@$BUN_VERSION"
          set -- "$runtime_dir"/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one Bun compile runtime tarball in $runtime_dir"
            exit 1
          fi
          tar -xzf "$1" -C "$runtime_dir"
          compile_executable="$runtime_dir/package/bin/bun"
          if [ ! -x "$compile_executable" ]; then
            echo "::error::Bun compile runtime is not executable: $compile_executable"
            exit 1
          fi
          runtime_version="$($compile_executable --version)"
          if [ "$runtime_version" != "$BUN_VERSION" ]; then
            echo "::error::expected compile runtime Bun $BUN_VERSION, got $runtime_version"
            exit 1
          fi
          printf 'path=%s\n' "$compile_executable" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - name: Build standalone executable
        env:
          BUN_COMPILE_EXECUTABLE_PATH: ${{ steps.compile-runtime.outputs.path }}
        run: bun scripts/build-binary.ts --target "${{ matrix.target }}" --outfile "dist/${{ matrix.asset }}/quickstudy" --compile-executable-path "$BUN_COMPILE_EXECUTABLE_PATH"
      - name: Smoke-test the executable outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/dist/${{ matrix.asset }}/quickstudy"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"

          "$binary" --version >/dev/null
          "$binary" --help >/dev/null

          # A checkout-less binary must still author-and-run: a toy eval and a
          # host echo experiment, created inline (no scaffold command exists).
          # The compiled binary dynamically imports both external modules at
          # runtime — verified as part of this smoke.
          mkdir -p evals/smoke/local experiments
          cat > evals/smoke/PROMPT.md <<'EOF'
          ---
          id: smoke
          suite: benchmark
          ---

          Write NOTES.md describing the task.
          EOF
          # Both modules import the harness BY PACKAGE NAME — the contract for
          # all consumer code — so this smoke fails if the binary ever loses
          # the ability to resolve "quickstudy" from dynamically imported
          # files (the self-resolution plugin in src/cli.ts).
          cat > evals/smoke/EVAL.ts <<'EOF'
          import type { EvalScorer } from "quickstudy";

          const scorer: EvalScorer = async (ctx) => {
            const ok = await ctx.fileExists("NOTES.md");
            const seed = await ctx.fileExists("seed.txt");
            return { passed: ok && seed, checks: [
              { name: "notes-written", passed: ok },
              { name: "local-delivered", passed: seed },
            ] };
          };

          export default scorer;
          EOF
          echo "seed" > evals/smoke/local/seed.txt
          cat > experiments/echo-smoke.ts <<'EOF'
          import { defineExperiment } from "quickstudy";

          export default defineExperiment({
            id: "echo-smoke",
            agent: { adapter: "echo" },
            runtime: { kind: "host" },
          });
          EOF

          "$binary" validate >/dev/null
          run_output="$("$binary" run --eval smoke --experiment echo-smoke --trials 1 --db smoke.db --results results)"
          run_id="$(printf '%s\n' "$run_output" | bash "$GITHUB_WORKSPACE/scripts/ci/extract-smoke-run-id.sh")"
          test -n "$run_id"
          report_output="$("$binary" report "$run_id" --db smoke.db --results results)"
          printf '%s\n' "$report_output" | grep -q "100% pass rate"
      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE "dist/${{ matrix.asset }}/LICENSE"
          cp .github/release-README.txt "dist/${{ matrix.asset }}/README.txt"
          printf 'ref=%s\ncommit=%s\n' "$SOURCE_REF" "$SOURCE_SHA" > "dist/${{ matrix.asset }}/SOURCE.txt"
          cd "dist/${{ matrix.asset }}"
          tar -czf "../${{ matrix.asset }}.tar.gz" quickstudy LICENSE README.txt SOURCE.txt
          cd ..
          shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  # A tag must not ship a broken npm tarball: pack, install into a clean temp
  # dir, run the bin, validate fixture roots. One runner suffices — the
  # tarball is platform-independent TypeScript source plus ui/dist.
  pack-check:
    name: Tarball self-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Pack, install, and run the tarball outside the checkout
        run: bash scripts/pack-check.sh

  release:
    name: Attach binaries and publish release
    needs: [build, pack-check]
    # pull_request runs carry no tag_name and validate only.
    if: inputs.tag_name != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach binaries to the release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository from git.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          # release-please already created the release (draft) with its
          # generated changelog title and body, so this step only uploads the
          # archives and undrafts. Creating the release here would collide
          # with release-please's, and regenerating notes would clobber its
          # changelog — neither is done.
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  # npm is the secondary channel: the same tagged source, packed with prepack
  # (bun run ui:build) exactly as pack-check just validated it. Runs after the
  # GitHub release publishes so npm never leads the primary channel. Auth is
  # npm trusted publishing (OIDC) — no registry token exists anywhere in this
  # repository. npm validates the CALLING workflow's filename, so the package's
  # single trusted publisher on npmjs.com is release-please.yml, not this
  # file. An already-published version is skipped, so re-running this job
  # converges instead of failing on EPUBLISHCONFLICT.
  publish-npm:
    name: Publish to npm
    needs: [pack-check, release]
    if: inputs.tag_name != ''
    runs-on: ubuntu-24.04 # trusted publishing requires GitHub-hosted runners
    permissions:
      contents: read
      id-token: write # OIDC token exchange with registry.npmjs.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
      # npm publishes whatever package.json says; a tag whose version differs
      # would ship under the wrong number. Fail before any network setup.
      - name: Verify the tag matches package.json
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "${RELEASE_TAG#v}" ]; then
            echo "::error::package.json is $pkg_version but the tag is $RELEASE_TAG"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # prepack (bun run ui:build) needs the dev dependencies installed.
      - run: bun install --frozen-lockfile
      # Trusted publishing needs npm >= 11.5.1; Node 24 ships it. registry-url
      # writes a fresh user npmrc pinned to registry.npmjs.org.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          # npm's OIDC exchange targets the CONFIGURED registry, not a
          # --registry flag. Pin it at step scope so nothing job-level can
          # redirect the exchange to a proxy (which fails as a bare ENEEDAUTH).
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          # Trusted publishing generates provenance by default, and npm refuses
          # to do so from a private repository. Remove once this repo is public.
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          set -euo pipefail
          # setup-node writes an `_authToken=${NODE_AUTH_TOKEN}` line. With no
          # token set, npm must fall through to OIDC, not send an empty token.
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          version="${RELEASE_TAG#v}"
          pkg="$(node -p "require('./package.json').name")"
          if npm view "$pkg@$version" version >/dev/null 2>&1; then
            echo "$pkg@$version is already published; skipping"
            exit 0
          fi
          dist_tag=latest
          case "$version" in *-*) dist_tag=beta ;; esac
          npm publish --access public --tag "$dist_tag"
