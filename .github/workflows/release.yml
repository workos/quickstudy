name: release binaries

# Two entry points, both synchronous (no reliance on GITHUB_TOKEN tag/release
# events, which GitHub suppresses for runs triggered by the GITHUB_TOKEN):
#   1. workflow_call from .github/workflows/release-please.yml — release-please
#      has already created the vX.Y.Z tag and a DRAFT release; this workflow
#      checks out the exact tag, builds + smoke-tests the four native
#      binaries, runs the tarball self-check, then attaches the archives to
#      that draft release and undrafts it. tag_name is required here.
#   2. workflow_dispatch — a manual rebuild. Supply an existing v* tag in
#      release_tag to rebuild + re-publish that tag's release; leave it empty
#      to build the immutable dispatch-event commit as downloadable workflow
#      artifacts only (no release is created or touched).
on:
  workflow_call:
    inputs:
      tag_name:
        description: Existing v* tag whose release-please draft release to attach binaries to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to release (leave empty to build artifacts only)
        required: false
        type: string

permissions:
  contents: read

# A manual dispatch must not race a release-please-triggered call for the same
# tag and double-publish; cancel-in-progress: false so a running release is
# never aborted mid-build.
concurrency:
  group: release-${{ inputs.tag_name || inputs.release_tag || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64-baseline
            asset: quickstudy-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: quickstudy-linux-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: quickstudy-darwin-x64
          - runner: macos-15
            target: bun-darwin-arm64
            asset: quickstudy-darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the requested tag, never the branch that happened to
          # dispatch the workflow. workflow_call -> tag_name; workflow_dispatch
          # with a release_tag -> that tag; artifact-only dispatch -> the
          # immutable event SHA.
          ref: ${{ inputs.tag_name || inputs.release_tag || github.sha }}
          fetch-depth: 0
      - name: Verify checked-out source
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_TAG: ${{ inputs.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ -n "$REQUESTED_TAG" ]; then
            case "$REQUESTED_TAG" in
              v*) ;;
              *) echo "::error::tag must begin with v"; exit 1 ;;
            esac
            expected="$(git rev-list -n 1 "refs/tags/$REQUESTED_TAG")"
            source_ref="$REQUESTED_TAG"
          else
            source_ref="$EVENT_SHA"
            expected="$EVENT_SHA"
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked out $actual, expected $expected from $source_ref"
            exit 1
          fi
          echo "SOURCE_REF=$source_ref" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$actual" >> "$GITHUB_ENV"
      - uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
        if: runner.os == 'Linux'
        with:
          token: ${{ secrets.SOCKET_FIREWALL_TOKEN }}
          configure-bun: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Build standalone executable
        run: bun scripts/build-binary.ts --target "${{ matrix.target }}" --outfile "dist/${{ matrix.asset }}/quickstudy"
      - name: Smoke-test the executable outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/dist/${{ matrix.asset }}/quickstudy"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"

          "$binary" --version >/dev/null
          "$binary" --help >/dev/null

          # A checkout-less binary must still author-and-run: a toy eval and a
          # host echo experiment, created inline (no scaffold command exists).
          # The compiled binary dynamically imports both external modules at
          # runtime — verified as part of this smoke.
          mkdir -p evals/smoke/local experiments
          cat > evals/smoke/PROMPT.md <<'EOF'
          ---
          id: smoke
          suite: benchmark
          ---

          Write NOTES.md describing the task.
          EOF
          # Both modules import the harness BY PACKAGE NAME — the contract for
          # all consumer code — so this smoke fails if the binary ever loses
          # the ability to resolve "quickstudy" from dynamically imported
          # files (the self-resolution plugin in src/cli.ts).
          cat > evals/smoke/EVAL.ts <<'EOF'
          import type { EvalScorer } from "quickstudy";

          const scorer: EvalScorer = async (ctx) => {
            const ok = await ctx.fileExists("NOTES.md");
            const seed = await ctx.fileExists("seed.txt");
            return { passed: ok && seed, checks: [
              { name: "notes-written", passed: ok },
              { name: "local-delivered", passed: seed },
            ] };
          };

          export default scorer;
          EOF
          echo "seed" > evals/smoke/local/seed.txt
          cat > experiments/echo-smoke.ts <<'EOF'
          import { defineExperiment } from "quickstudy";

          export default defineExperiment({
            id: "echo-smoke",
            agent: { adapter: "echo" },
            runtime: { kind: "host" },
          });
          EOF

          "$binary" validate >/dev/null
          run_output="$("$binary" run --eval smoke --experiment echo-smoke --trials 1 --db smoke.db --results results)"
          # The run id is a 26-char Crockford-base32 ULID. Anchor on that so
          # the preceding `run starting: N attempt(s)` line is not captured.
          run_id="$(printf '%s\n' "$run_output" | sed -n 's/^run \([0-9A-Z]\{26\}\):.*/\1/p')"
          test -n "$run_id"
          report_output="$("$binary" report "$run_id" --db smoke.db --results results)"
          printf '%s\n' "$report_output" | grep -q "100% pass rate"
      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE "dist/${{ matrix.asset }}/LICENSE"
          cp .github/release-README.txt "dist/${{ matrix.asset }}/README.txt"
          printf 'ref=%s\ncommit=%s\n' "$SOURCE_REF" "$SOURCE_SHA" > "dist/${{ matrix.asset }}/SOURCE.txt"
          cd "dist/${{ matrix.asset }}"
          tar -czf "../${{ matrix.asset }}.tar.gz" quickstudy LICENSE README.txt SOURCE.txt
          cd ..
          shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  # A tag must not ship a broken npm tarball: pack, install into a clean temp
  # dir, run the bin, validate fixture roots. One runner suffices — the
  # tarball is platform-independent TypeScript source plus ui/dist.
  pack-check:
    name: Tarball self-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || inputs.release_tag || github.sha }}
      - uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
        if: runner.os == 'Linux'
        with:
          token: ${{ secrets.SOCKET_FIREWALL_TOKEN }}
          configure-bun: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Pack, install, and run the tarball outside the checkout
        run: bash scripts/pack-check.sh

  release:
    name: Attach binaries and publish release
    needs: [build, pack-check]
    # Artifact-only dispatches (no tag_name and no release_tag) skip publish.
    if: inputs.tag_name != '' || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null
      - name: Attach binaries to the release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name || inputs.release_tag }}
        run: |
          # release-please already created the release (draft) with its
          # generated changelog title and body, so this step only uploads the
          # archives and undrafts. Creating the release here would collide
          # with release-please's, and regenerating notes would clobber its
          # changelog — neither is done.
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
