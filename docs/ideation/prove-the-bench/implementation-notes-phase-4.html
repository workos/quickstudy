      <section class="note-entry">
        <h3>Oracle fixture experiment moved to tests/__fixtures__/oracle/experiments/</h3>
        <dl>
          <dt>Context</dt><dd>The spec puts oracle-local.ts in tests/__fixtures__/experiments/, but runner-v3 and graded-checks tests plan every experiment in that dir against solution-less evals and pin its id list to [&quot;echo-local&quot;].</dd>
          <dt>Decision</dt><dd>Placed it at tests/__fixtures__/oracle/experiments/oracle-local.ts (spec deviation, per scout).</dd>
          <dt>Alternative</dt><dd>Keep the spec path and add filters to three existing tests.</dd>
        </dl>
      </section>
      <section class="note-entry">
        <h3>validateOracle is per-eval</h3>
        <dl>
          <dt>Context</dt><dd>The spec&#x27;s file table says validateOracle(evals, opts); its code block says (loaded, opts) -&gt; OracleOutcome.</dd>
          <dt>Decision</dt><dd>Per-eval form; the CLI loops. Added formatOracleOutcome for the output line.</dd>
          <dt>Alternative</dt><dd>A batch function returning a map.</dd>
        </dl>
      </section>
      <section class="note-entry">
        <h3>RuntimeCapabilityError not exported from src/index.ts</h3>
        <dl>
          <dt>Context</dt><dd>The spec makes the export conditional on scorers wanting to catch it. Scorers run in a worker and only the error message crosses the boundary, so instanceof can never match in a scorer.</dd>
          <dt>Decision</dt><dd>Skipped the export; the class is documented in context.ts.</dd>
          <dt>Alternative</dt><dd>Type-only export of limited use.</dd>
        </dl>
      </section>
      <section class="note-entry">
        <h3>validate --oracle exit and experiments root</h3>
        <dl>
          <dt>Context</dt><dd>fail() exits immediately; validate also validates the experiments root after the eval list.</dd>
          <dt>Decision</dt><dd>Oracle lines print right after the eval list; the FAILED/MISSING summary fail() runs at the end so the experiments root is still validated. --oracle with no evals root errors.</dd>
          <dt>Alternative</dt><dd>Call fail() immediately after the oracle lines.</dd>
        </dl>
      </section>
      <section class="note-entry">
        <h3>Extra files touched for typecheck/tests</h3>
        <dl>
          <dt>Context</dt><dd>A required EvalIdentity.solution / LoadedEval.solutionDir broke literals in scripts/seed-run.ts, tests/costs.test.ts and tests/plan-v3.test.ts; tests/docker.test.ts pins the container adapter list; identity-v3 pins the key set.</dd>
          <dt>Decision</dt><dd>Added solution: null / solutionDir: null, appended oracle to the pinned adapter list and solution to the key snapshot. Note: scripts/seed-run.ts is also being edited concurrently by a sibling phase.</dd>
          <dt>Alternative</dt><dd>Make the fields optional.</dd>
        </dl>
      </section>
      <section class="note-entry">
        <h3>Manifest hash shifts; semantic scorers under validate</h3>
        <dl>
          <dt>Context</dt><dd>Adding solution to EvalIdentity changes manifest.hash, so runs started before this change cannot be resumed. Semantic scorers have no agentOutput under validate.</dd>
          <dt>Decision</dt><dd>Accepted the resume break (eval hash and attempt identity unchanged). Documented that semantic scorers report FAILED under validate and should be proven with the oracle experiment.</dd>
          <dt>Alternative</dt><dd>Treat missing agentOutput as a tracked capability (deferred).</dd>
        </dl>
      </section>
.
-->
